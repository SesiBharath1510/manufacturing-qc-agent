version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: factory_timescaledb
    restart: always
    environment:
      POSTGRES_USER: factory_admin
      POSTGRES_PASSWORD: factory_secure_password_2026
      POSTGRES_DB: factory_telemetry
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

volumes:
  timescaledb_data: