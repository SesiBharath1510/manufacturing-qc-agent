name: Industrial Multimodal QC Pipeline CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas matplotlib scipy sqlalchemy pytest onnx ultralytics opencv-python-headless psycopg2-binary

    - name: Initialize Database and Triton Config
      run: |
        python src/05_sensor_drift_detector.py
        python src/11_timescaledb_engine.py
        python src/16_triton_export_and_config.py

    - name: Run Automated Unit & Integration Tests
      run: |
        pytest tests/test_pipeline.py -v