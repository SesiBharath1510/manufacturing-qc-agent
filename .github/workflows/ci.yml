name: Industrial Multimodal QC Pipeline CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest onnx evidently

    - name: Verify MLOps Data Versioning (DVC Manifest)
      run: |
        python -c "import os; assert os.path.exists('data.dvc'), 'data.dvc missing'"

    - name: Run Automated Unit & Integration Tests
      run: |
        pytest tests/test_pipeline.py -v